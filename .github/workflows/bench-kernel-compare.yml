name: bench-kernel-compare

# Runs Criterion kernel microbenchmarks on Neoverse N1, comparing a branch
# against main. Posts a summary comment on the PR.
#
# Scope: bench_ltembed_kernel_* + elementwise/* (no model.safetensors needed).

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "benches/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      compare_ref:
        description: Branch, tag, or SHA to benchmark against main
        required: true

jobs:
  bench-compare:
    name: Kernel benchmark comparison (Neoverse N1)
    runs-on:
      - self-hosted
      - Linux
      - ARM64

    permissions:
      contents: read
      pull-requests: write

    env:
      MODEL_ID: intfloat/e5-small-v2
      MODEL_DIR: ${{ github.workspace }}/.cache/models/intfloat-e5-small-v2
      RUSTFLAGS: "-C target-cpu=native"

    steps:
      # Shallow checkout (matches what existing workflows use on this runner).
      # We fetch main explicitly below so git checkout "$BASE_SHA" works.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0

      # Cache registry/git only — do NOT cache target/ so criterion baselines
      # are always freshly produced and never stale.
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-arm64-bench-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm64-bench-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache model config/tokenizer
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_DIR }}
          key: ${{ runner.os }}-arm64-model-config-e5-small-v2-v1

      # Download only config.json + tokenizer files — no model weights needed.
      # kernel_assets_available() checks for these two files to enable
      # bench_ltembed_kernel_projection / attention benchmarks.
      - name: Download model config and tokenizer
        run: |
          pip install --quiet huggingface_hub
          mkdir -p "$MODEL_DIR"
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id=os.environ["MODEL_ID"],
              local_dir=os.environ["MODEL_DIR"],
              local_dir_use_symlinks=False,
              allow_patterns=[
                  "config.json",
                  "tokenizer.json",
                  "tokenizer_config.json",
                  "special_tokens_map.json",
                  "vocab.txt",
              ],
          )
          PY
          mkdir -p assets
          cp "$MODEL_DIR/config.json"    assets/config.json
          cp "$MODEL_DIR/tokenizer.json" assets/tokenizer.json

      # Fetch main and the compare branch by name so git checkout can find them.
      # Shallow (--depth=1) checkout only fetches the PR merge ref; the
      # individual branch commits aren't present, so SHA-based checkout fails.
      # Using branch names via origin/<branch> is reliable after an explicit fetch.
      - name: Fetch main and compare branch
        run: |
          git fetch --depth=1 origin main
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --depth=1 origin "${{ github.head_ref }}"
            echo "COMPARE_REF=origin/${{ github.head_ref }}" >> "$GITHUB_ENV"
            echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
          else
            git fetch --depth=1 origin "${{ inputs.compare_ref }}"
            echo "COMPARE_REF=origin/${{ inputs.compare_ref }}" >> "$GITHUB_ENV"
            echo "PR_NUMBER=" >> "$GITHUB_ENV"
          fi

      # ── Step 1: benchmark main, save as named baseline ─────────────────────
      - name: Benchmark main (save baseline)
        run: |
          git checkout origin/main
          mkdir -p assets
          cp "$MODEL_DIR/config.json"    assets/config.json
          cp "$MODEL_DIR/tokenizer.json" assets/tokenizer.json
          cargo bench --bench inference \
            -- 'kernel|elementwise' --save-baseline main \
            2>&1

      # ── Step 2: benchmark PR, compare against main baseline ─────────────────
      - name: Benchmark PR branch (compare vs main)
        run: |
          git checkout "$COMPARE_REF"
          # Re-copy assets — git checkout may have reverted them if tracked
          mkdir -p assets
          cp "$MODEL_DIR/config.json"    assets/config.json
          cp "$MODEL_DIR/tokenizer.json" assets/tokenizer.json
          cargo bench --bench inference \
            -- 'kernel|elementwise' --baseline main \
            2>&1 | tee /tmp/bench_compare.txt

      # ── Step 3: generate human-readable summary ─────────────────────────────
      - name: Generate summary
        run: |
          python3 - <<'PY'
          import re, sys

          with open("/tmp/bench_compare.txt") as f:
              text = f.read()

          # Split into per-benchmark blocks (each starts with a non-whitespace line
          # that is not a Criterion status line)
          ignore = re.compile(
              r"^(Benchmarking|Gnuplot|Found \d+ outlier|  \d+ \(\d)"
          )
          rows = []
          current_name = None
          time_line = thrpt_line = change_line = verdict = None

          for line in text.splitlines():
              stripped = line.strip()
              if not line.startswith(" ") and stripped and not ignore.match(stripped):
                  # New benchmark block
                  if current_name:
                      rows.append((current_name, time_line, thrpt_line, change_line, verdict))
                  current_name = stripped
                  time_line = thrpt_line = change_line = verdict = None
              elif "time:   [" in line and time_line is None:
                  time_line = stripped
              elif "thrpt:  [" in line and thrpt_line is None:
                  thrpt_line = stripped
              elif re.search(r"time:.*\(p =", line) and change_line is None:
                  change_line = stripped
              elif re.search(r"Performance has (improved|regressed)|No change|noise threshold", line):
                  verdict = stripped

          if current_name:
              rows.append((current_name, time_line, thrpt_line, change_line, verdict))

          EMOJI = {
              "improved": "✅",
              "regressed": "🔴",
          }

          lines = [
              "## Kernel benchmark comparison — Neoverse N1",
              "",
              f"`RUSTFLAGS=-C target-cpu=native` · PR vs `main`",
              "",
              "| Benchmark | Time (median) | Throughput | Change | |",
              "|-----------|--------------|------------|--------|---|",
          ]
          for name, t, tp, ch, v in rows:
              # Extract median from "time:   [lo  med  hi]"
              med = re.search(r"\[.*?\s+([\d.]+\s+\S+)\s+[\d.]+\s+\S+\]", t or "")
              med_s = med.group(1) if med else (t or "—")
              tp_s = "—"
              if tp:
                  m = re.search(r"\[.*?\s+([\d.]+\s+\S+)\s+[\d.]+\s+\S+\]", tp)
                  tp_s = m.group(1) if m else "—"
              pct = "—"
              if ch:
                  m = re.search(r"\[([-+\d.]+%)\s+([-+\d.]+%)\s+([-+\d.]+%)\]", ch)
                  pct = m.group(2) if m else ch
              emoji = ""
              if v:
                  for k, e in EMOJI.items():
                      if k in v.lower():
                          emoji = e
                          break
              lines.append(f"| `{name}` | {med_s} | {tp_s} | {pct} | {emoji} |")

          with open("/tmp/bench_summary.md", "w") as f:
              f.write("\n".join(lines) + "\n")

          print("\n".join(lines))
          PY

      # ── Step 4: post PR comment ──────────────────────────────────────────────
      - name: Post PR comment
        if: env.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --body-file /tmp/bench_summary.md \
            --repo "${{ github.repository }}"

      # ── Step 5: upload full criterion output as artifact ────────────────────
      - name: Upload raw benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-kernel-compare-n1
          retention-days: 14
          path: /tmp/bench_compare.txt
