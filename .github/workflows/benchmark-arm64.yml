name: benchmark-arm64

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      quants:
        description: >-
          Comma-separated GGUF quants to benchmark, from the pinned set in
          scripts/assemble_gguf_bundle.py (UD-Q4_K_XL, UD-Q5_K_XL, UD-Q6_K_XL, Q8_0, BF16)
        required: false
        default: "UD-Q4_K_XL,UD-Q5_K_XL,Q8_0"
      warmup:
        description: Warmup iterations per scenario
        required: false
        default: "10"
      iters:
        description: Timed iterations per scenario
        required: false
        default: "100"
      cold_iters:
        description: Fresh-process cold-start runs per scenario (aggregated into one distribution)
        required: false
        default: "10"
      threads:
        description: CPU threads per implementation
        required: false
        default: "1"
      output_dimension:
        description: Output embedding dimension after post-processing
        required: false
        default: "512"
      l2_normalize:
        description: Apply L2 normalization after post-processing
        required: false
        default: true
        type: boolean
      scenario:
        description: Optional single scenario to benchmark
        required: false
        default: ""
      include_cold_start:
        description: Include cold start measurements
        required: false
        default: true
        type: boolean
      include_retrieval_eval:
        description: Include the CN/EN cross-lingual retrieval eval
        required: false
        default: true
        type: boolean
      retrieval_pairs:
        description: Number of CN/EN translation pairs to sample for the retrieval eval
        required: false
        default: "500"

env:
  # The GGUF repository, recorded as each quant's model id (build-info.json target_id).
  MODEL_ID: unsloth/embeddinggemma-2-GGUF
  CN_EN_CSV_REL: tests/CN_EN_Data.csv

jobs:
  # Fan out over GGUF quants. Each job benchmarks one quant against a shared PyTorch FP32
  # reference (produced once by the `reference` job) using the generated CN/EN cross-lingual
  # retrieval fixture, and uploads an independent artifact. The `report` job then
  # aggregates every quant into results.json + report.md with a recommended quant.
  prepare:
    runs-on: ubuntu-24.04-arm
    outputs:
      quants: ${{ steps.parse.outputs.quants }}
    steps:
      - id: parse
        run: |
          python3 - <<'PY' >>"$GITHUB_OUTPUT"
          import json, os
          raw = os.environ["QUANTS_INPUT"] or "UD-Q4_K_XL,UD-Q5_K_XL,Q8_0"
          quants = [q.strip() for q in raw.split(",") if q.strip()]
          print("quants=" + json.dumps(quants))
          PY
        env:
          QUANTS_INPUT: ${{ inputs.quants }}

  # Run PyTorch ONCE. Its correctness/retrieval embeddings are quant-independent (they use the
  # F32 safetensors model through SentenceTransformers, never a GGUF bundle), so producing them
  # here — instead of inside every quant job — removes N-1 redundant torch import + model-load
  # cycles per matrix run. The embeddings are uploaded as a reference artifact that each quant
  # job compares against.
  reference:
    runs-on: ubuntu-24.04-arm
    env:
      MODEL_DIR: ${{ github.workspace }}/.cache/models/unsloth-embeddinggemma-2
      BENCHMARK_RUNNER_LABELS: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache Pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-arm64-pip-${{ hashFiles('.github/workflows/benchmark-arm64.yml') }}
          restore-keys: |
            ${{ runner.os }}-arm64-pip-

      # Keyed on the pinned revision (TOKENIZER_REVISION in scripts/assemble_gguf_bundle.py,
      # which is also the golden fixture's model revision): bump both together.
      - name: Cache Model
        uses: actions/cache@v5
        with:
          path: ${{ env.MODEL_DIR }}
          key: ${{ runner.os }}-arm64-model-embeddinggemma-2-${{ hashFiles('scripts/assemble_gguf_bundle.py') }}

      # The versions scripts/generate_fixtures.py recorded for the golden fixture
      # (tests/fixtures/test_fixtures.json reference.versions). EmbeddingGemma2Processor
      # imports torchvision and pillow even for text; torch and torchvision come from the
      # same CPU index so that their operators match.
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy huggingface_hub pillow \
            "sentence-transformers==6.1.0" "transformers==5.19.0"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.14.1" "torchvision==0.29.1"

      # The safetensors model at the revision the bundle's tokenizer.json and the golden
      # fixture come from; scripts/assemble_gguf_bundle.py holds the pin.
      - name: Download Model Snapshot
        run: |
          mkdir -p "$MODEL_DIR"
          python - <<'PY'
          import os
          import sys

          from huggingface_hub import snapshot_download

          sys.path.insert(0, "scripts")
          import assemble_gguf_bundle as pins

          snapshot_download(
              repo_id=pins.TOKENIZER_REPO,
              revision=pins.TOKENIZER_REVISION,
              local_dir=os.environ["MODEL_DIR"],
              allow_patterns=[
                  "config.json",
                  "config_sentence_transformers.json",
                  "modules.json",
                  "sentence_bert_config.json",
                  "1_Pooling/*",
                  "2_Normalize/*",
                  "tokenizer.json",
                  "tokenizer_config.json",
                  "tokenizer.model",
                  "chat_template.jinja",
                  "preprocessor_config.json",
                  "processor_config.json",
                  "model.safetensors",
              ],
          )
          PY

      - name: Generate CN/EN cross-lingual retrieval eval
        run: |
          set -euo pipefail
          mkdir -p reference
          python3 scripts/build_cn_en_retrieval_cases.py \
            --csv "$CN_EN_CSV_REL" \
            --num-pairs "${{ inputs.retrieval_pairs }}" \
            --output reference/cn_en_retrieval_cases.json \
            --fixture-output reference/cn_en_fixture.json

      - name: Emit PyTorch reference (retrieval embeddings)
        run: |
          set -euo pipefail
          EXTRA_ARGS=""
          if [ "${{ inputs.l2_normalize }}" != "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --no-l2-normalize"
          fi
          python3 scripts/run_embedding_benchmarks.py \
            --model-dir "$MODEL_DIR" \
            --model-id "$MODEL_ID" \
            --model-source "huggingface" \
            --output-dimension "${{ inputs.output_dimension }}" \
            --threads "${{ inputs.threads }}" \
            --retrieval-eval-path reference/cn_en_retrieval_cases.json \
            --emit-reference reference/reference.json \
            $EXTRA_ARGS

      - name: Upload reference artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-reference
          retention-days: 3
          path: |
            reference/reference.json
            reference/cn_en_fixture.json
            reference/cn_en_retrieval_cases.json
          if-no-files-found: error

  benchmark:
    needs: [prepare, reference]
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        quant: ${{ fromJSON(needs.prepare.outputs.quants) }}
    env:
      # Keep Cargo's home inside the workspace so actions/cache archives paths with zero
      # `../` hops. Home-relative caches bake in a fixed number of parent-dir traversals at
      # save time, which breaks restore when the runner's workspace depth differs (e.g. a
      # cache saved on a self-hosted runner failing to extract on a GitHub-hosted one).
      CARGO_HOME: ${{ github.workspace }}/.cargo
      BUNDLE_DIR: ${{ github.workspace }}/gguf_bundle/${{ matrix.quant }}
      STATIC_LLAMA_REPO: Lychee-Technology/static-llama-cpp-rs-builder
      STATIC_LLAMA_TAG: v0.1.159-2
      STATIC_LLAMA_LLAMA_CPP_COMMIT: cbe28bb3cb0758f0c566a9a3561766821aeb0748
      # Repo-pinned sha256 of the aarch64-graviton2 tarball. fetch-static-llama.sh exports it
      # as STATIC_LLAMA_SHA256, which the metadata step records.
      STATIC_LLAMA_SHA256_AARCH64: 720b395930962c9c7a17e1f2828b41fc8fc188db075e44b8583fb402bcdee5a3
      BENCHMARK_RUNNER_LABELS: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0

      # rust-toolchain.toml requests clippy+rustfmt, which rustup auto-installs on the first
      # cargo invocation. On the GitHub-hosted arm64 image that install can hit a stale
      # cargo-clippy binary ("detected conflict: 'bin/cargo-clippy'") and abort the build.
      # Reconcile the components up front so cargo runs cleanly.
      - name: Reconcile toolchain components
        run: |
          set -euo pipefail
          rustup component add clippy rustfmt --toolchain 1.94.0 \
            || rustup toolchain install 1.94.0 --profile minimal --component clippy --component rustfmt --force

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache Cargo Registry
        uses: actions/cache@v5
        with:
          path: |
            .cargo/registry
            .cargo/git
            target
          key: ${{ runner.os }}-arm64-cargo-v2-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm64-cargo-v2-

      - name: Cache Pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-arm64-pip-${{ hashFiles('.github/workflows/benchmark-arm64.yml') }}
          restore-keys: |
            ${{ runner.os }}-arm64-pip-

      - name: Fetch prebuilt static llama.cpp artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-static-llama.sh

      # Quant jobs run ltembed only (PyTorch already ran in the `reference` job), so they need
      # numpy for the retrieval-metric matmul — but no torch/transformers.
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy

      # The pinned GGUF revision and per-quant sha256 live in the script, which fails on an
      # unpinned quant or a hash mismatch.
      - name: Assemble GGUF bundle (${{ matrix.quant }})
        run: |
          set -euo pipefail
          rm -rf "$BUNDLE_DIR"
          python3 scripts/assemble_gguf_bundle.py "$BUNDLE_DIR" --quant "${{ matrix.quant }}"
          echo "model.gguf size: $(du -h "$BUNDLE_DIR/model.gguf" | cut -f1)"

      # Build the release binary once, up front. Invoking the compiled binary directly (rather
      # than `cargo run --release` per launch) keeps cargo's freshness check and the multi-minute
      # release compile out of the timed harness, and surfaces compile errors with visible stderr.
      - name: Build benchmark_ltembed (release)
        run: cargo build --release --bin benchmark_ltembed

      - name: Download reference artifact
        uses: actions/download-artifact@v7
        with:
          name: benchmark-reference
          path: reference

      - name: Run Unified Benchmark Harness
        run: |
          set -euo pipefail
          export LTEMBED_PROFILE="1"
          mkdir -p "artifacts/${{ matrix.quant }}"
          EXTRA_ARGS=""
          if [ "${{ inputs.l2_normalize }}" != "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --no-l2-normalize"
          fi
          if [ "${{ inputs.include_cold_start }}" != "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --no-include-cold-start"
          fi
          if [ -n "${{ inputs.scenario }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --scenario ${{ inputs.scenario }}"
          fi
          if [ "${{ inputs.include_retrieval_eval }}" != "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --no-include-retrieval-eval"
          fi
          python3 scripts/run_embedding_benchmarks.py \
            --bundle-dir "$BUNDLE_DIR" \
            --model-id "$MODEL_ID" \
            --model-source "huggingface" \
            --output-dimension "${{ inputs.output_dimension }}" \
            --warmup "${{ inputs.warmup }}" \
            --iters "${{ inputs.iters }}" \
            --cold-iters "${{ inputs.cold_iters }}" \
            --threads "${{ inputs.threads }}" \
            --retrieval-eval-path reference/cn_en_retrieval_cases.json \
            --reference-path reference/reference.json \
            --fixture-path reference/cn_en_fixture.json \
            --golden-parity \
            --golden-fixture-path tests/fixtures/test_fixtures.json \
            --output-csv "artifacts/${{ matrix.quant }}/benchmark-report.csv" \
            --output-summary "artifacts/${{ matrix.quant }}/benchmark-summary.txt" \
            $EXTRA_ARGS

      - name: Record run metadata
        run: |
          set -euo pipefail
          SCENARIO_ARGS=()
          if [ -n "${{ inputs.scenario }}" ]; then
            SCENARIO_ARGS=(--scenarios "${{ inputs.scenario }}")
          fi
          L2_ARGS=(--l2-normalize)
          if [ "${{ inputs.l2_normalize }}" != "true" ]; then
            L2_ARGS=(--no-l2-normalize)
          fi
          python3 scripts/write_benchmark_metadata.py \
            --quant "${{ matrix.quant }}" \
            --model-id "$MODEL_ID" \
            --model-file "$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["files"]["model.gguf"]["file"])' "$BUNDLE_DIR/provenance.json")" \
            --bundle-dir "$BUNDLE_DIR" \
            --static-llama-dir "$STATIC_LLAMA_DIR" \
            --static-llama-tag "$STATIC_LLAMA_TAG" \
            --static-llama-sha256 "$STATIC_LLAMA_SHA256" \
            --runner-labels "$BENCHMARK_RUNNER_LABELS" \
            --threads "${{ inputs.threads }}" \
            --warmup-iters "${{ inputs.warmup }}" \
            --timed-iters "${{ inputs.iters }}" \
            --cold-iters "${{ inputs.cold_iters }}" \
            --output-dimension "${{ inputs.output_dimension }}" \
            "${L2_ARGS[@]}" \
            "${SCENARIO_ARGS[@]}" \
            --output "artifacts/${{ matrix.quant }}/metadata.json"

      - name: Upload Benchmark Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-arm64-${{ matrix.quant }}
          retention-days: 3
          path: artifacts/${{ matrix.quant }}/**

  # Aggregate every quant's per-job artifact into one cross-quant comparison (report.md +
  # results.json) and surface it in the run summary, including a recommended quant.
  # Runs even when matrix jobs fail (partial data is still useful for debugging), but the
  # renderer is told the dispatched quant list: a partial matrix is labeled INCOMPLETE and
  # produces no recommendation.
  report:
    needs: [prepare, benchmark]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v7
        with:
          path: bench-results
          pattern: benchmark-arm64-*

      - name: Render cross-quant report
        env:
          EXPECTED_QUANTS: ${{ needs.prepare.outputs.quants }}
        run: |
          python3 scripts/render_benchmark_report.py bench-results . \
            --expected-quants "$EXPECTED_QUANTS"

      - name: Upload aggregated report
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          retention-days: 3
          path: |
            report.md
            results.json
          if-no-files-found: error
