name: benchmark-arm64

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      warmup:
        description: Warmup iterations per scenario
        required: false
        default: "10"
      iters:
        description: Timed iterations per scenario
        required: false
        default: "100"
      threads:
        description: CPU threads per implementation
        required: false
        default: "1"
      include_cold_start:
        description: Include cold start measurements
        required: false
        default: true
        type: boolean
      include_correctness:
        description: Include correctness checks against PyTorch
        required: false
        default: true
        type: boolean

jobs:
  benchmark:
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    env:
      MODEL_ID: jinaai/jina-embeddings-v5-text-nano-retrieval
      MODEL_DIR: ${{ github.workspace }}/.cache/models/jinaai-jina-embeddings-v5-text-nano-retrieval
      ORT_BUNDLE_DIR: ${{ github.workspace }}/ort_bundle
      BUILDER_REPO: Lychee-Technology/minimal-ort-builder
      BUILDER_RELEASE_TAG: v1.0.10
      BUILDER_ASSET_NAME: jinaai__jina-embeddings-v5-text-nano-retrieval_q4f16_linux-arm64.tar.gz
      BUILDER_ASSET_SHA256: 9b5654cf4315d3c2770a24435d12aac9ab50606da5298d314cb6712bf059c604
      BENCHMARK_RUNNER_LABELS: self-hosted,Linux,ARM64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm64-cargo-

      - name: Cache Pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-arm64-pip-${{ hashFiles('.github/workflows/benchmark-arm64.yml') }}
          restore-keys: |
            ${{ runner.os }}-arm64-pip-

      - name: Cache Model
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_DIR }}
          key: ${{ runner.os }}-arm64-model-jina-v2

      - name: Cache ORT Bundle
        id: cache-ort-bundle
        uses: actions/cache@v4
        with:
          path: ${{ env.ORT_BUNDLE_DIR }}
          key: ${{ runner.os }}-arm64-ort-bundle-v1.0.10-jina-retrieval-q4f16

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy transformers huggingface_hub
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Download Model Snapshot
        run: |
          mkdir -p "$MODEL_DIR"
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id=os.environ["MODEL_ID"],
              local_dir=os.environ["MODEL_DIR"],
              local_dir_use_symlinks=False,
              allow_patterns=[
                  "config.json",
                  "tokenizer.json",
                  "tokenizer_config.json",
                  "special_tokens_map.json",
                  "vocab.txt",
                  "model.safetensors",
                  "*.py",
              ],
          )
          PY

      - name: Download ORT Bundle
        if: steps.cache-ort-bundle.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$ORT_BUNDLE_DIR"
          curl -fsSL \
            -o "$RUNNER_TEMP/$BUILDER_ASSET_NAME" \
            "https://github.com/$BUILDER_REPO/releases/download/$BUILDER_RELEASE_TAG/$BUILDER_ASSET_NAME"
          echo "$BUILDER_ASSET_SHA256  $RUNNER_TEMP/$BUILDER_ASSET_NAME" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$BUILDER_ASSET_NAME" -C "$ORT_BUNDLE_DIR"
          test -f "$ORT_BUNDLE_DIR/model.ort"
          test -f "$ORT_BUNDLE_DIR/tokenizer.json"
          test -f "$ORT_BUNDLE_DIR/build-info.json"
          test -f "$ORT_BUNDLE_DIR/libonnxruntime.so"

      # Compile check with visible errors before handing off to the Python
      # harness, which swallows Cargo's stderr via capture_output=True.
      - name: Cargo check (visible errors)
        run: RUSTFLAGS="-C target-cpu=native" cargo check --bin benchmark_ltembed

      - name: Run Unified Benchmark Harness
        run: |
          export ORT_DYLIB_PATH="$ORT_BUNDLE_DIR/libonnxruntime.so"
          export LD_LIBRARY_PATH="$ORT_BUNDLE_DIR:${LD_LIBRARY_PATH:-}"
          EXTRA_ARGS=""
          if [ "${{ inputs.include_cold_start }}" != "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --no-include-cold-start"
          fi
          if [ "${{ inputs.include_correctness }}" != "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --no-include-correctness"
          fi
          python3 scripts/run_embedding_benchmarks.py \
            --model-dir "$MODEL_DIR" \
            --ort-bundle-dir "$ORT_BUNDLE_DIR" \
            --model-id "$MODEL_ID" \
            --model-source "huggingface" \
            --warmup "${{ inputs.warmup }}" \
            --iters "${{ inputs.iters }}" \
            --threads "${{ inputs.threads }}" \
            --output-csv "${{ github.workspace }}/artifacts/benchmark-report.csv" \
            --output-summary "${{ github.workspace }}/artifacts/benchmark-summary.txt" \
            $EXTRA_ARGS

      - name: Upload Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-arm64-results
          retention-days: 1
          path: |
            artifacts/benchmark-report.csv
            artifacts/benchmark-summary.txt
