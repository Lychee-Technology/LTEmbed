name: benchmark-arm64

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      warmup:
        description: Warmup iterations per scenario
        required: false
        default: "10"
      iters:
        description: Timed iterations per scenario
        required: false
        default: "100"
      threads:
        description: CPU threads per implementation
        required: false
        default: "1"
      output_dimension:
        description: Output embedding dimension after post-processing
        required: false
        default: "512"
      l2_normalize:
        description: Apply L2 normalization after post-processing
        required: false
        default: true
        type: boolean
      scenario:
        description: Optional single scenario to benchmark
        required: false
        default: ""
      raw_compare_only:
        description: Run raw embedding compare instead of the benchmark harness
        required: false
        default: false
        type: boolean
      include_cold_start:
        description: Include cold start measurements
        required: false
        default: true
        type: boolean
      include_correctness:
        description: Include correctness checks against PyTorch
        required: false
        default: true
        type: boolean

jobs:
  benchmark:
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    env:
      MODEL_ID: jinaai/jina-embeddings-v5-text-nano-retrieval
      MODEL_DIR: ${{ github.workspace }}/.cache/models/jinaai-jina-embeddings-v5-text-nano-retrieval
      ORT_BUNDLE_DIR: ${{ github.workspace }}/ort_bundle
      BUILDER_REPO: Lychee-Technology/minimal-ort-builder
      BUILDER_RELEASE_TAG: v1.0.16-b
      BUILDER_ASSET_NAME: jinaai__jina-embeddings-v5-text-nano-retrieval_q4f16_linux-arm64.tar.gz
      BUILDER_ASSET_SHA256: 6ff82b97bb7b77f1e8b220007cf2b059b4a6dc92cebd2dc5d53984dc27e23b88
      BENCHMARK_RUNNER_LABELS: self-hosted,Linux,ARM64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm64-cargo-

      - name: Cache Pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-arm64-pip-${{ hashFiles('.github/workflows/benchmark-arm64.yml') }}
          restore-keys: |
            ${{ runner.os }}-arm64-pip-

      - name: Cache Model
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_DIR }}
          key: ${{ runner.os }}-arm64-model-jina-v2

      - name: Cache ORT Bundle
        id: cache-ort-bundle
        uses: actions/cache@v4
        with:
          path: ${{ env.ORT_BUNDLE_DIR }}
          key: ${{ runner.os }}-arm64-ort-bundle-v1.0.16-b-jina-retrieval-q4f16

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy transformers huggingface_hub
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Download Model Snapshot
        run: |
          mkdir -p "$MODEL_DIR"
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id=os.environ["MODEL_ID"],
              local_dir=os.environ["MODEL_DIR"],
              local_dir_use_symlinks=False,
              allow_patterns=[
                  "config.json",
                  "tokenizer.json",
                  "tokenizer_config.json",
                  "special_tokens_map.json",
                  "vocab.txt",
                  "model.safetensors",
                  "*.py",
              ],
          )
          PY

      - name: Download ORT Bundle
        if: steps.cache-ort-bundle.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$ORT_BUNDLE_DIR"
          curl -fsSL \
            -o "$RUNNER_TEMP/$BUILDER_ASSET_NAME" \
            "https://github.com/$BUILDER_REPO/releases/download/$BUILDER_RELEASE_TAG/$BUILDER_ASSET_NAME"
          echo "$BUILDER_ASSET_SHA256  $RUNNER_TEMP/$BUILDER_ASSET_NAME" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$BUILDER_ASSET_NAME" -C "$ORT_BUNDLE_DIR"
          test -f "$ORT_BUNDLE_DIR/model.ort"
          test -f "$ORT_BUNDLE_DIR/tokenizer.json"
          test -f "$ORT_BUNDLE_DIR/build-info.json"
          test -f "$ORT_BUNDLE_DIR/libonnxruntime.so"

      # Compile check with visible errors before handing off to the Python
      # harness, which swallows Cargo's stderr via capture_output=True.
      - name: Cargo check (visible errors)
        run: RUSTFLAGS="-C target-cpu=native" cargo check --bin benchmark_ltembed

      - name: Run Unified Benchmark Harness
        if: ${{ inputs.raw_compare_only != true }}
        run: |
          export ORT_DYLIB_PATH="$ORT_BUNDLE_DIR/libonnxruntime.so"
          export LTEMBED_PROFILE="1"
          export LD_LIBRARY_PATH="$ORT_BUNDLE_DIR:${LD_LIBRARY_PATH:-}"
          EXTRA_ARGS=()
          if [ "${{ inputs.include_cold_start }}" != "true" ]; then
            EXTRA_ARGS+=(--no-include-cold-start)
          fi
          if [ "${{ inputs.include_correctness }}" != "true" ]; then
            EXTRA_ARGS+=(--no-include-correctness)
          fi
          if [ -n "${{ inputs.scenario }}" ]; then
            EXTRA_ARGS+=(--scenario "${{ inputs.scenario }}")
          fi
          if [ "${{ inputs.l2_normalize }}" = "true" ]; then
            EXTRA_ARGS+=(--l2-normalize)
          else
            EXTRA_ARGS+=(--no-l2-normalize)
          fi
          python3 scripts/run_embedding_benchmarks.py \
            --model-dir "$MODEL_DIR" \
            --ort-bundle-dir "$ORT_BUNDLE_DIR" \
            --model-id "$MODEL_ID" \
            --model-source "huggingface" \
            --output-dimension "${{ inputs.output_dimension }}" \
            --warmup "${{ inputs.warmup }}" \
            --iters "${{ inputs.iters }}" \
            --threads "${{ inputs.threads }}" \
            --output-csv "${{ github.workspace }}/artifacts/benchmark-report.csv" \
            --output-summary "${{ github.workspace }}/artifacts/benchmark-summary.txt" \
            "${EXTRA_ARGS[@]}"

      - name: Run Raw Embedding Compare
        if: ${{ inputs.raw_compare_only == true }}
        run: |
          mkdir -p artifacts
          export ORT_DYLIB_PATH="$ORT_BUNDLE_DIR/libonnxruntime.so"
          export LD_LIBRARY_PATH="$ORT_BUNDLE_DIR:${LD_LIBRARY_PATH:-}"
          if [ "${{ inputs.scenario }}" = "" ]; then
            SCENARIO="single/medium"
          else
            SCENARIO="${{ inputs.scenario }}"
          fi
          if [ "${{ inputs.l2_normalize }}" = "true" ]; then
            PYTORCH_NORMALIZE_FLAG=(--l2-normalize)
            LTEMBED_NORMALIZE_VALUE=true
          else
            PYTORCH_NORMALIZE_FLAG=(--no-l2-normalize)
            LTEMBED_NORMALIZE_VALUE=false
          fi
          python3 scripts/bench_pytorch.py \
            --mode correctness \
            --scenario "$SCENARIO" \
            --model-name-or-path "$MODEL_DIR" \
            --output-dimension "${{ inputs.output_dimension }}" \
            "${PYTORCH_NORMALIZE_FLAG[@]}" \
            --threads "${{ inputs.threads }}" \
            > artifacts/pytorch-correctness.json
          cargo run --quiet --release --bin benchmark_ltembed -- \
            --mode correctness \
            --scenario "$SCENARIO" \
            --ort-bundle-dir "$ORT_BUNDLE_DIR" \
            --output-dimension "${{ inputs.output_dimension }}" \
            --l2-normalize "$LTEMBED_NORMALIZE_VALUE" \
            --threads "${{ inputs.threads }}" \
            > artifacts/ltembed-correctness.json
          python3 scripts/compare_embedding_outputs.py \
            --ltembed-json artifacts/ltembed-correctness.json \
            --pytorch-json artifacts/pytorch-correctness.json \
            --scenario "$SCENARIO" \
            --output-json artifacts/raw-embedding-compare.json \
            --output-text artifacts/raw-embedding-compare.txt
          cat artifacts/raw-embedding-compare.txt

      - name: Upload Benchmark Artifacts
        if: ${{ inputs.raw_compare_only != true }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-arm64-results
          retention-days: 1
          path: |
            artifacts/benchmark-report.csv
            artifacts/benchmark-summary.txt

      - name: Upload Raw Compare Artifacts
        if: ${{ inputs.raw_compare_only == true }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-arm64-results
          retention-days: 1
          path: |
            artifacts/ltembed-correctness.json
            artifacts/pytorch-correctness.json
            artifacts/raw-embedding-compare.json
            artifacts/raw-embedding-compare.txt
