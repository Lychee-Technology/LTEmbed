name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep Cargo's home inside the workspace so actions/cache archives paths with zero `../`
  # hops. Home-relative caches bake in a fixed number of parent-dir traversals at save time,
  # which breaks restore when the runner's workspace depth differs (e.g. a cache saved on a
  # self-hosted runner failing to extract on a GitHub-hosted one).
  CARGO_HOME: ${{ github.workspace }}/.cargo
  # Prebuilt static llama.cpp archives the crate links against (see build.rs). The crate
  # cannot build without these, so every job fetches + verifies them and exports
  # STATIC_LLAMA_DIR before running cargo.
  STATIC_LLAMA_REPO: Lychee-Technology/static-llama-cpp-rs-builder
  STATIC_LLAMA_TAG: v0.1.151-1
  # Repo-pinned sha256 of static-llama-cpp-${STATIC_LLAMA_TAG}-aarch64-graviton2.tar.gz.
  STATIC_LLAMA_SHA256: 48f3aa293824086d667d3938b40be37390d31275af20fd20a88c3880bfee2b90

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.94.0 toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            .cargo/registry
            .cargo/git
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Fetch prebuilt static llama.cpp artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-static-llama.sh

      - name: Create empty assets/ directory (model.safetensors not in CI)
        run: mkdir -p assets

      - name: Run library unit tests
        run: cargo test --lib

      - name: Verify Rust API example compiles
        run: cargo check --example api_usage

      # Assemble a real GGUF bundle so the model-backed integration tests (golden parity,
      # batch/normalization/dimension) actually run inference through the llama.cpp backend.
      # Without this the bundle-gated tests silently skip and CI can pass on a broken engine
      # (e.g. the batch-padding pooling bug).
      - name: Assemble GGUF bundle for model-backed tests
        env:
          GGUF_REPO: jinaai/jina-embeddings-v5-text-nano-retrieval
          QUANT: Q5_K_M
        run: |
          set -euo pipefail
          BUNDLE="${{ github.workspace }}/ci_gguf_bundle"
          mkdir -p "$BUNDLE"
          curl -fsSL -o "$BUNDLE/model.gguf" \
            "https://huggingface.co/$GGUF_REPO/resolve/main/v5-nano-retrieval-$QUANT.gguf"
          curl -fsSL -o "$BUNDLE/tokenizer.json" \
            "https://huggingface.co/$GGUF_REPO/resolve/main/tokenizer.json"
          cat > "$BUNDLE/build-info.json" <<'JSON'
          {
            "target_id": "jinaai/jina-embeddings-v5-text-nano-retrieval",
            "model_metadata": {
              "model_format": "gguf",
              "quant": "Q5_K_M",
              "pooling": "last_token",
              "input_kind": "retrieval",
              "query_prefix": "Query: ",
              "document_prefix": "Document: ",
              "raw_embedding_dimension": 768,
              "output_embedding_dimension": 768,
              "max_length": 8192
            }
          }
          JSON
          echo "LTEMBED_TEST_BUNDLE_DIR=$BUNDLE" >> "$GITHUB_ENV"

      - name: Run integration tests (llama.cpp GGUF inference)
        run: cargo test --test integration_tests

  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.94.0 toolchain with components
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            .cargo/registry
            .cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-v2-

      - name: Fetch prebuilt static llama.cpp artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-static-llama.sh

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings
