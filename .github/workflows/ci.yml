name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep Cargo's home inside the workspace so actions/cache archives paths with zero `../`
  # hops. Home-relative caches bake in a fixed number of parent-dir traversals at save time,
  # which breaks restore when the runner's workspace depth differs (e.g. a cache saved on a
  # self-hosted runner failing to extract on a GitHub-hosted one).
  CARGO_HOME: ${{ github.workspace }}/.cargo
  # Prebuilt static llama.cpp archives the crate links against (see build.rs). The crate
  # cannot build without these, so every job fetches + verifies them and exports
  # STATIC_LLAMA_DIR before running cargo. .github/scripts/fetch-static-llama.sh picks the
  # variant for the runner's architecture.
  STATIC_LLAMA_REPO: Lychee-Technology/static-llama-cpp-rs-builder
  STATIC_LLAMA_TAG: v0.1.159-2
  # llama.cpp b11577 (0.6.0-dev), the engine commit the release compiles (build-info.json
  # llama_cpp.commit). The first llama.cpp with EmbeddingGemma 2 (gemma-embedding2) support.
  STATIC_LLAMA_LLAMA_CPP_COMMIT: cbe28bb3cb0758f0c566a9a3561766821aeb0748
  # Repo-pinned sha256 of static-llama-cpp-${STATIC_LLAMA_TAG}-aarch64-graviton2.tar.gz.
  STATIC_LLAMA_SHA256_AARCH64: 720b395930962c9c7a17e1f2828b41fc8fc188db075e44b8583fb402bcdee5a3
  # Repo-pinned sha256 of static-llama-cpp-${STATIC_LLAMA_TAG}-x86_64-v3-linux-gnu.tar.gz.
  STATIC_LLAMA_SHA256_X86_64: 12c16eba8a756025d8ae2721544cef7b13decaf1b04e04ef1371dfeead50113d

jobs:
  test:
    # The ARM64 entry keeps the plain `Test` check name.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test
            runner: ubuntu-24.04-arm
          # The x86_64 archives need an x86-64-v3 CPU; fetch-static-llama.sh checks the
          # runner and fails the job, rather than letting the tests SIGILL, if it is not.
          - name: Test (x86_64-v3)
            runner: ubuntu-24.04
    env:
      # Bundle-gated integration tests fail instead of skipping when LTEMBED_TEST_BUNDLE_DIR
      # is missing. Set here rather than in the assemble step so that it does not depend on
      # the $GITHUB_ENV hand-off it guards.
      LTEMBED_REQUIRE_TEST_BUNDLE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.94.0 toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            .cargo/registry
            .cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-v2-

      - name: Fetch prebuilt static llama.cpp artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-static-llama.sh

      - name: Create empty assets/ directory (model.safetensors not in CI)
        run: mkdir -p assets

      - name: Run library unit tests
        run: cargo test --lib

      # Its own test binary (it installs a counting global allocator), so --lib skips it.
      - name: Run tokenizer reload memory test
        run: cargo test --test tokenizer_reload_tests

      # Benchmark support tests and the benchmark binary's unit tests are not covered by
      # --lib or --test integration_tests; run them explicitly so scenario/corpus changes
      # are gated.
      - name: Run benchmark support and binary tests
        run: cargo test --test benchmarking_support_tests --bin benchmark_ltembed

      - name: Verify Rust API example compiles
        run: cargo check --example api_usage

      # Assemble a real GGUF bundle so the bundle-gated integration tests actually run: golden
      # and llama.cpp reference parity, batch/normalization/dimension through llama.cpp
      # inference, token-id parity against the bundle's tokenizer.json. A CI pass must not hide
      # a broken engine (e.g. the batch-padding pooling bug), so if LTEMBED_TEST_BUNDLE_DIR does
      # not reach the integration step, LTEMBED_REQUIRE_TEST_BUNDLE (job env above) makes them
      # fail, not skip. The script holds the pinned Hugging Face revisions and sha256 of the
      # GGUF and tokenizer.json (the release workflow uses the same pins) and fails on any
      # mismatch.
      - name: Assemble GGUF bundle for model-backed tests
        run: |
          set -euo pipefail
          BUNDLE="${{ github.workspace }}/ci_gguf_bundle"
          python3 scripts/assemble_gguf_bundle.py "$BUNDLE"
          echo "LTEMBED_TEST_BUNDLE_DIR=$BUNDLE" >> "$GITHUB_ENV"

      # The bundle's tokenizer.json, which inference tokenizes with, against the GGUF's own
      # vocabulary, which upstream llama.cpp tokenizes with: identical token ids on ~76k
      # encodings of a fixed corpus (src/engine/tokenizer_parity.rs). The test is #[ignore]d
      # in the plain `cargo test --lib` above because it needs the bundle.
      - name: Run tokenizer parity test (tokenizer.json vs the GGUF vocabulary)
        run: cargo test --lib tokenizer_parity -- --ignored

      - name: Run integration tests (llama.cpp GGUF inference)
        run: cargo test --test integration_tests

  python-tests:
    name: Python script tests
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install pytest numpy

      # Covers both unittest-style and pytest-style test modules under tests/.
      - name: Run Python script tests
        run: python3 -m pytest tests/ -q

  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      # Offline: relative links and anchors in every tracked Markdown file, and the paths and
      # `file` § "Section" references in AGENTS.md files. Needs only Git and the runner's
      # python3, so it runs before the toolchain, cache and static llama.cpp steps.
      - name: Check Markdown links and AGENTS.md paths
        run: python3 scripts/check_doc_references.py

      - name: Install Rust 1.94.0 toolchain with components
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            .cargo/registry
            .cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-v2-

      - name: Fetch prebuilt static llama.cpp artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-static-llama.sh

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings

      # Fails on any rustdoc warning, e.g. a broken intra-doc link. Only public items are
      # documented (no --document-private-items), so a public doc comment that links to a
      # crate-private item fails too.
      - name: Rustdoc (warnings as errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
