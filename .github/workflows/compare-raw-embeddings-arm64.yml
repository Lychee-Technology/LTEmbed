name: compare-raw-embeddings-arm64

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      builder_release_tag:
        description: minimal-ort-builder release tag
        required: false
        default: "v1.0.16-b"
      builder_asset_name:
        description: ORT bundle asset name
        required: false
        default: "jinaai__jina-embeddings-v5-text-nano-retrieval_q4f16_linux-arm64.tar.gz"
      builder_asset_sha256:
        description: ORT bundle asset sha256
        required: false
        default: "6ff82b97bb7b77f1e8b220007cf2b059b4a6dc92cebd2dc5d53984dc27e23b88"
      scenario:
        description: Scenario to compare
        required: false
        default: "single/medium"
      output_dimension:
        description: Output embedding dimension after post-processing
        required: false
        default: "768"
      l2_normalize:
        description: Apply L2 normalization before comparison
        required: false
        default: false
        type: boolean

jobs:
  compare:
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    env:
      MODEL_ID: jinaai/jina-embeddings-v5-text-nano-retrieval
      MODEL_DIR: ${{ github.workspace }}/.cache/models/jinaai-jina-embeddings-v5-text-nano-retrieval
      ORT_BUNDLE_DIR: ${{ github.workspace }}/ort_bundle
      BUILDER_REPO: Lychee-Technology/minimal-ort-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm64-cargo-

      - name: Cache Pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-arm64-compare-raw-embeddings-pip-${{ hashFiles('.github/workflows/compare-raw-embeddings-arm64.yml') }}
          restore-keys: |
            ${{ runner.os }}-arm64-compare-raw-embeddings-pip-

      - name: Cache Model
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_DIR }}
          key: ${{ runner.os }}-arm64-model-jina-v2

      - name: Cache ORT Bundle
        id: cache-ort-bundle
        uses: actions/cache@v4
        with:
          path: ${{ env.ORT_BUNDLE_DIR }}
          key: ${{ runner.os }}-arm64-compare-raw-embeddings-${{ inputs.builder_release_tag }}-${{ inputs.builder_asset_name }}

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy transformers huggingface_hub
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Download Model Snapshot
        run: |
          mkdir -p "$MODEL_DIR"
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id=os.environ["MODEL_ID"],
              local_dir=os.environ["MODEL_DIR"],
              local_dir_use_symlinks=False,
              allow_patterns=[
                  "config.json",
                  "tokenizer.json",
                  "tokenizer_config.json",
                  "special_tokens_map.json",
                  "vocab.txt",
                  "model.safetensors",
                  "*.py",
              ],
          )
          PY

      - name: Download ORT Bundle
        if: steps.cache-ort-bundle.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$ORT_BUNDLE_DIR"
          curl -fsSL \
            -o "$RUNNER_TEMP/${{ inputs.builder_asset_name }}" \
            "https://github.com/$BUILDER_REPO/releases/download/${{ inputs.builder_release_tag }}/${{ inputs.builder_asset_name }}"
          echo "${{ inputs.builder_asset_sha256 }}  $RUNNER_TEMP/${{ inputs.builder_asset_name }}" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/${{ inputs.builder_asset_name }}" -C "$ORT_BUNDLE_DIR"
          test -f "$ORT_BUNDLE_DIR/model.ort"
          test -f "$ORT_BUNDLE_DIR/tokenizer.json"
          test -f "$ORT_BUNDLE_DIR/build-info.json"
          test -f "$ORT_BUNDLE_DIR/libonnxruntime.so"

      - name: Cargo check (visible errors)
        run: RUSTFLAGS="-C target-cpu=native" cargo check --bin benchmark_ltembed

      - name: Compare Raw Embeddings
        run: |
          mkdir -p artifacts
          export ORT_DYLIB_PATH="$ORT_BUNDLE_DIR/libonnxruntime.so"
          export LD_LIBRARY_PATH="$ORT_BUNDLE_DIR:${LD_LIBRARY_PATH:-}"
          if [ "${{ inputs.l2_normalize }}" = "true" ]; then
            PYTORCH_NORMALIZE_FLAG=(--l2-normalize)
            LTEMBED_NORMALIZE_VALUE=true
          else
            PYTORCH_NORMALIZE_FLAG=(--no-l2-normalize)
            LTEMBED_NORMALIZE_VALUE=false
          fi
          python3 scripts/bench_pytorch.py \
            --mode correctness \
            --scenario "${{ inputs.scenario }}" \
            --model-name-or-path "$MODEL_DIR" \
            --output-dimension "${{ inputs.output_dimension }}" \
            "${PYTORCH_NORMALIZE_FLAG[@]}" \
            --threads 1 \
            > artifacts/pytorch-correctness.json
          cargo run --quiet --release --bin benchmark_ltembed -- \
            --mode correctness \
            --scenario "${{ inputs.scenario }}" \
            --ort-bundle-dir "$ORT_BUNDLE_DIR" \
            --output-dimension "${{ inputs.output_dimension }}" \
            --l2-normalize "$LTEMBED_NORMALIZE_VALUE" \
            --threads 1 \
            > artifacts/ltembed-correctness.json
          python3 scripts/compare_embedding_outputs.py \
            --ltembed-json artifacts/ltembed-correctness.json \
            --pytorch-json artifacts/pytorch-correctness.json \
            --scenario "${{ inputs.scenario }}" \
            --output-json artifacts/raw-embedding-compare.json \
            --output-text artifacts/raw-embedding-compare.txt
          cat artifacts/raw-embedding-compare.txt

      - name: Upload Compare Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compare-raw-embeddings-arm64-results
          retention-days: 1
          path: |
            artifacts/ltembed-correctness.json
            artifacts/pytorch-correctness.json
            artifacts/raw-embedding-compare.json
            artifacts/raw-embedding-compare.txt
