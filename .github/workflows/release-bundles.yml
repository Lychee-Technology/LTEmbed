name: release-bundles

# Package an LTEmbed source tree + a ready-to-load GGUF bundle (model.gguf + tokenizer.json +
# build-info.json) into a release tarball. Mirrors the runtime's bundle contract; the old ORT
# (model.ort + libonnxruntime.so) layout was removed with the llama.cpp/GGUF migration.
#
# workflow_dispatch builds + uploads a workflow artifact only (safe to run any time). On a
# published release it also uploads the tarball as a release asset. Pushing a v* tag creates
# the release automatically (if missing) and uploads the tarball to it.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package-${{ matrix.quant }}
    runs-on: ubuntu-24.04-arm
    env:
      # Empty on workflow_dispatch, which skips every release-facing step below.
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event_name == 'release' && github.event.release.tag_name || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Q5_K_M is the smallest quant that clears the ≥0.99 parity gate while fitting the
          # 250 MB Lambda limit (≈169 MB gguf + ≈17 MB tokenizer). See docs/llama-cpp-spike-results.md.
          - gguf_repo: jinaai/jina-embeddings-v5-text-nano-retrieval
            quant: Q5_K_M
            expected_model_id: jinaai/jina-embeddings-v5-text-nano-retrieval
            output_dimension: 512
            l2_normalize: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble GGUF bundle
        env:
          GGUF_REPO: ${{ matrix.gguf_repo }}
          QUANT: ${{ matrix.quant }}
          EXPECTED_MODEL_ID: ${{ matrix.expected_model_id }}
        run: |
          set -euo pipefail
          BUNDLE=artifacts/gguf_bundle
          mkdir -p "$BUNDLE"
          curl -fsSL -o "$BUNDLE/model.gguf" \
            "https://huggingface.co/$GGUF_REPO/resolve/main/v5-nano-retrieval-$QUANT.gguf"
          curl -fsSL -o "$BUNDLE/tokenizer.json" \
            "https://huggingface.co/$GGUF_REPO/resolve/main/tokenizer.json"
          cat > "$BUNDLE/build-info.json" <<JSON
          {
            "target_id": "$EXPECTED_MODEL_ID",
            "model_metadata": {
              "model_format": "gguf",
              "quant": "$QUANT",
              "pooling": "last_token",
              "input_kind": "retrieval",
              "query_prefix": "Query: ",
              "document_prefix": "Document: ",
              "raw_embedding_dimension": 768,
              "output_embedding_dimension": 768,
              "max_length": 8192
            }
          }
          JSON
          test -f "$BUNDLE/model.gguf"
          test -f "$BUNDLE/tokenizer.json"
          test -f "$BUNDLE/build-info.json"
          ( cd "$BUNDLE" && sha256sum model.gguf tokenizer.json build-info.json > SHA256SUMS )

      - name: Build LTEmbed release tarball
        id: bundle
        env:
          GGUF_REPO: ${{ matrix.gguf_repo }}
          QUANT: ${{ matrix.quant }}
          EXPECTED_MODEL_ID: ${{ matrix.expected_model_id }}
          OUTPUT_DIMENSION: ${{ matrix.output_dimension }}
          L2_NORMALIZE: ${{ matrix.l2_normalize }}
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))["package"]["version"])
          PY
          )"

          if [ -n "${RELEASE_TAG}" ] && [ "v${VERSION}" != "${RELEASE_TAG}" ]; then
            echo "::warning::release tag ${RELEASE_TAG} does not match Cargo.toml version v${VERSION}"
          fi

          MODEL_SLUG="${EXPECTED_MODEL_ID//\//__}"
          ROOT_NAME="ltembed-${VERSION}-${MODEL_SLUG}-${QUANT}-linux-arm64"
          OUTPUT_NAME="${ROOT_NAME}.tar.gz"

          mkdir -p artifacts/package
          git archive --format=tar --prefix="${ROOT_NAME}/" HEAD | tar -xf - -C artifacts/package
          cp -r artifacts/gguf_bundle "artifacts/package/${ROOT_NAME}/gguf_bundle"
          tar -czf "artifacts/package/${OUTPUT_NAME}" -C artifacts/package "${ROOT_NAME}"
          # Fail loudly if the GGUF bundle didn't make it into the archive.
          tar -tzf "artifacts/package/${OUTPUT_NAME}" | grep -q "${ROOT_NAME}/gguf_bundle/model.gguf"

          {
            echo "gguf_repo=${GGUF_REPO}"
            echo "quant=${QUANT}"
            echo "expected_model_id=${EXPECTED_MODEL_ID}"
            echo "output_dimension=${OUTPUT_DIMENSION}"
            echo "l2_normalize=${L2_NORMALIZE}"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "path=artifacts/package/${OUTPUT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "name=${OUTPUT_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: ${{ steps.bundle.outputs.path }}
          retention-days: 7

      - name: Ensure release exists for tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "${RELEASE_TAG}" \
                 --repo "${{ github.repository }}" \
                 --verify-tag \
                 --title "${RELEASE_TAG}" \
                 --generate-notes

      - name: Upload release asset
        if: github.event_name == 'release' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            "${{ steps.bundle.outputs.path }}" \
            --repo "${{ github.repository }}" \
            --clobber
