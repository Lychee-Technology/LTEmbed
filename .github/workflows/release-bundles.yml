name: release-bundles

# Package an LTEmbed source tree + a ready-to-load GGUF bundle (model.gguf + tokenizer.json +
# build-info.json, with SHA256SUMS and provenance.json) into a release tarball. Mirrors the
# runtime's bundle contract; the old ORT (model.ort + libonnxruntime.so) layout was removed
# with the llama.cpp/GGUF migration.
#
# The bundle comes from scripts/assemble_gguf_bundle.py, which downloads the GGUF and
# tokenizer.json from pinned Hugging Face revisions and checks their sha256, the same files
# the CI Test jobs run on ARM64 and x86-64-v3. This workflow does not build or test.
#
# workflow_dispatch builds + uploads a workflow artifact only (safe to run any time). On a
# published release it also uploads the tarball as a release asset. Pushing a v* tag creates
# the release automatically (if missing) and uploads the tarball to it.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package-${{ matrix.quant }}
    runs-on: ubuntu-24.04-arm
    env:
      # Empty on workflow_dispatch, which skips every release-facing step below.
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event_name == 'release' && github.event.release.tag_name || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # UD-Q4_K_XL is the quant LTEmbed's CI tests and the golden gates are calibrated
          # for. See docs/releases.md.
          - quant: UD-Q4_K_XL
            expected_model_id: unsloth/embeddinggemma-2-GGUF
            output_dimension: 512
            l2_normalize: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble GGUF bundle
        env:
          QUANT: ${{ matrix.quant }}
          EXPECTED_MODEL_ID: ${{ matrix.expected_model_id }}
        run: |
          set -euo pipefail
          BUNDLE=artifacts/gguf_bundle
          python3 scripts/assemble_gguf_bundle.py "$BUNDLE" --quant "$QUANT"
          # The script writes exactly these files; a projector (mmproj-*.gguf) or any other
          # extra file must never ship in a text bundle.
          contents="$(find "$BUNDLE" -mindepth 1 -printf '%f\n' | LC_ALL=C sort | tr '\n' ' ')"
          expected="SHA256SUMS build-info.json model.gguf provenance.json tokenizer.json "
          if [ "$contents" != "$expected" ]; then
            echo "::error::bundle holds '$contents', expected '$expected'"
            exit 1
          fi
          target_id="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["target_id"])' "$BUNDLE/build-info.json")"
          if [ "$target_id" != "$EXPECTED_MODEL_ID" ]; then
            echo "::error::build-info.json target_id is '$target_id' (expected '$EXPECTED_MODEL_ID')"
            exit 1
          fi
          ( cd "$BUNDLE" && sha256sum -c SHA256SUMS )

      - name: Build LTEmbed release tarball
        id: bundle
        env:
          QUANT: ${{ matrix.quant }}
          EXPECTED_MODEL_ID: ${{ matrix.expected_model_id }}
          OUTPUT_DIMENSION: ${{ matrix.output_dimension }}
          L2_NORMALIZE: ${{ matrix.l2_normalize }}
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))["package"]["version"])
          PY
          )"

          if [ -n "${RELEASE_TAG}" ] && [ "v${VERSION}" != "${RELEASE_TAG}" ]; then
            echo "::warning::release tag ${RELEASE_TAG} does not match Cargo.toml version v${VERSION}"
          fi

          MODEL_SLUG="${EXPECTED_MODEL_ID//\//__}"
          ROOT_NAME="ltembed-${VERSION}-${MODEL_SLUG}-${QUANT}-linux-arm64"
          OUTPUT_NAME="${ROOT_NAME}.tar.gz"

          mkdir -p artifacts/package
          git archive --format=tar --prefix="${ROOT_NAME}/" HEAD | tar -xf - -C artifacts/package
          cp -r artifacts/gguf_bundle "artifacts/package/${ROOT_NAME}/gguf_bundle"
          tar -czf "artifacts/package/${OUTPUT_NAME}" -C artifacts/package "${ROOT_NAME}"
          # Fail loudly if the GGUF bundle didn't make it into the archive. List into a file
          # instead of piping into `grep -q`: grep exits on the first match, which SIGPIPEs tar
          # and fails the step under `set -o pipefail` exactly when model.gguf IS present.
          tar -tzf "artifacts/package/${OUTPUT_NAME}" > artifacts/package/archive-contents.txt
          for file in model.gguf tokenizer.json build-info.json SHA256SUMS provenance.json; do
            grep -F -x -q "${ROOT_NAME}/gguf_bundle/${file}" artifacts/package/archive-contents.txt
          done
          if grep -i -q mmproj artifacts/package/archive-contents.txt; then
            echo "::error::the release archive contains an mmproj file"
            exit 1
          fi
          # Published next to the tarball: the bundle's own SHA256SUMS covers only its files.
          ( cd artifacts/package && sha256sum "${OUTPUT_NAME}" > "${OUTPUT_NAME}.sha256" )

          {
            python3 - artifacts/gguf_bundle/provenance.json <<'PY'
          import json, sys
          model = json.load(open(sys.argv[1]))["files"]["model.gguf"]
          print(f"gguf={model['repo']}@{model['revision']}/{model['file']}")
          print(f"model_sha256={model['sha256']}")
          PY
            echo "quant=${QUANT}"
            echo "expected_model_id=${EXPECTED_MODEL_ID}"
            echo "output_dimension=${OUTPUT_DIMENSION}"
            echo "l2_normalize=${L2_NORMALIZE}"
          } >> "${GITHUB_STEP_SUMMARY}"

          {
            echo "path=artifacts/package/${OUTPUT_NAME}"
            echo "checksum=artifacts/package/${OUTPUT_NAME}.sha256"
            echo "name=${OUTPUT_NAME}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: |
            ${{ steps.bundle.outputs.path }}
            ${{ steps.bundle.outputs.checksum }}
          retention-days: 7

      - name: Ensure release exists for tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if ! gh release create "${RELEASE_TAG}" \
                   --repo "${{ github.repository }}" \
                   --verify-tag \
                   --title "${RELEASE_TAG}" \
                   --generate-notes; then
              # Concurrent matrix jobs can race view||create; losing the creation race is fine,
              # but any other create failure must still fail the job.
              gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" >/dev/null
            fi
          fi

      - name: Upload release asset
        if: github.event_name == 'release' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            "${{ steps.bundle.outputs.path }}" \
            "${{ steps.bundle.outputs.checksum }}" \
            --repo "${{ github.repository }}" \
            --clobber
