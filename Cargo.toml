[package]
name = "ltembed"
version = "0.1.0"
edition = "2021"

# Library target: exposes internal modules to integration tests in tests/
[lib]
name = "ltembed"
path = "src/lib.rs"

[dependencies]
# ── Library core ──────────────────────────────────────────────────────────────
matrixmultiply = "0.3"
bytemuck = "1"
wide = "1"
ort = { version = "2.0.0-rc.12", features = ["load-dynamic", "ndarray"] }

# Tokenization — uses pure-Rust fancy-regex backend by default (no C deps)
tokenizers = "0.22"

# Model file loading (zero-copy mmap)
safetensors = "0.7"
memmap2 = "0.9"

# Config file parsing (config.json → BertConfig)
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# Error handling
thiserror = "2"

[[bench]]
name = "inference"
harness = false

[[example]]
name = "api_usage"
path = "examples/api_usage.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Same as release but keeps debug symbols and frame pointers for perf profiling.
[profile.release-debug]
inherits = "release"
debug = 1
force-frame-pointers = true

[profile.bench]
opt-level = 3
lto = "thin"

[dev-dependencies]
approx = "0.5"
static_assertions = "1"
serde = { version = "1", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
once_cell = "1"
