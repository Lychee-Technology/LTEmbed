[package]
name = "ltembed"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Library target: exposes internal modules to integration tests in tests/
[lib]
name = "ltembed"
path = "src/lib.rs"

[dependencies]
# ── Library core ──────────────────────────────────────────────────────────────
# The inference backend is llama.cpp/GGUF, linked from the prebuilt static archives
# published by `Lychee-Technology/static-llama-cpp-rs-builder` (see build.rs). There is no
# crates.io dependency for it: the static libs + bindgen bindings are consumed via raw FFI,
# so this crate builds only on aarch64 Linux or x86-64-v3 Linux, with STATIC_LLAMA_DIR set to
# the matching release variant (see docs/development.md).

# Structured metadata / fixture parsing
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# Error handling
thiserror = "2"

[[example]]
name = "api_usage"
path = "examples/api_usage.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Same as release but keeps debug symbols and frame pointers for perf profiling.
[profile.release-debug]
inherits = "release"
debug = 1
force-frame-pointers = true

[profile.bench]
opt-level = 3
lto = "thin"

[dev-dependencies]
approx = "0.5"
serde = { version = "1", features = ["derive"] }
# Hashes the release GGUF against tests/fixtures/llama_cpp_reference.json, and the reference
# tokenizer.json against tests/fixtures/token_ids.json.
sha2 = "0.11"
# Test-only: the engine tokenizes with the GGUF's own vocabulary, and neither the library nor a
# bundle carries a tokenizer.json. The tokenizer parity test (src/engine/tokenizer_parity.rs)
# loads the model's pinned tokenizer.json with this crate and compares it with the GGUF's
# vocabulary. Oniguruma regex backend (C, built via cc), the same engine as the Python
# `tokenizers` that wrote tests/fixtures/token_ids.json; training-only defaults are disabled.
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
