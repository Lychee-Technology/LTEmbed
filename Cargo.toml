[package]
name = "ltembed"
version = "0.1.0"
edition = "2021"

# Library target: exposes internal modules to integration tests in tests/
[lib]
name = "ltembed"
path = "src/lib.rs"

[features]
default = []
vendored-blas = ["dep:cblas", "dep:openblas-src"]

[dependencies]
# ── Library core ──────────────────────────────────────────────────────────────
matrixmultiply = "0.3.10"
rayon = "1"
bytemuck = "1"
wide = "0.7"

# Tokenization — uses pure-Rust fancy-regex backend by default (no C deps)
tokenizers = "0.22.2"

# Model file loading (zero-copy mmap)
safetensors = "0.7"
memmap2 = "0.9.10"

# Config file parsing (config.json → BertConfig)
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# Error handling
thiserror = "2"

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
cblas = { version = "0.5", optional = true }
openblas-src = { version = "0.10.14", default-features = false, features = ["cblas", "static"], optional = true }

[[bench]]
name = "inference"
harness = false

[[example]]
name = "api_usage"
path = "examples/api_usage.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"

[dev-dependencies]
approx = "0.5"
static_assertions = "1"
serde = { version = "1", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
once_cell = "1"
candle-core = "0.9.2"
candle-nn = "0.9.2"
candle-transformers = "0.9.2"
