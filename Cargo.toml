[package]
name = "ltembed"
version = "0.1.0"
edition = "2021"

# Library target: exposes internal modules to integration tests in tests/
[lib]
name = "ltembed"
path = "src/lib.rs"

[dependencies]
# ── Library core ──────────────────────────────────────────────────────────────
# default-features off: `download-binaries` (compile-time onnxruntime fetch) and
# `tls-native` (ureq → openssl-sys) are useless under load-dynamic — the dylib
# ships in the ort bundle — and break consumers on runners without OpenSSL headers.
ort = { version = "2.0.0-rc.12", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "api-24",
    "load-dynamic",
] }

# Tokenization — uses pure-Rust fancy-regex backend by default (no C deps)
tokenizers = "0.22"

# Structured metadata / fixture parsing
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# Error handling
thiserror = "2"

[[example]]
name = "api_usage"
path = "examples/api_usage.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Same as release but keeps debug symbols and frame pointers for perf profiling.
[profile.release-debug]
inherits = "release"
debug = 1
force-frame-pointers = true

[profile.bench]
opt-level = 3
lto = "thin"

[dev-dependencies]
approx = "0.5"
static_assertions = "1"
serde = { version = "1", features = ["derive"] }
