[package]
name = "ltembed"
version = "0.1.0"
edition = "2021"

# Lambda custom runtime: binary must be named "bootstrap"
[[bin]]
name = "bootstrap"
path = "src/main.rs"

# Library target: exposes internal modules to integration tests in tests/
[lib]
name = "ltembed"
path = "src/lib.rs"

[dependencies]
# ── Library core ──────────────────────────────────────────────────────────────
matrixmultiply = "0.3.10"
bytemuck = "1"

# Tokenization — uses pure-Rust fancy-regex backend by default (no C deps)
tokenizers = "0.22.2"

# Model file loading (zero-copy mmap)
safetensors = "0.7"
memmap2 = "0.9.10"

# Config file parsing (config.json → BertConfig)
serde_json = "1"

# Error handling
thiserror = "2"

# ── Lambda deployment binary only (src/main.rs) ───────────────────────────────
lambda_http = "0.13"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bench]]
name = "inference"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"

[dev-dependencies]
approx = "0.5"
static_assertions = "1"
serde = { version = "1", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
once_cell = "1"
