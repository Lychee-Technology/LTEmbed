[package]
name = "ltembed"
version = "0.1.0"
edition = "2021"

# Library target: exposes internal modules to integration tests in tests/
[lib]
name = "ltembed"
path = "src/lib.rs"

[dependencies]
# ── Library core ──────────────────────────────────────────────────────────────
# The inference backend is llama.cpp/GGUF, linked from the prebuilt static archives
# published by `Lychee-Technology/static-llama-cpp-rs-builder` (see build.rs). There is no
# crates.io dependency for it: the static libs + bindgen bindings are consumed via raw FFI,
# so this crate builds only on aarch64 Linux or x86-64-v3 Linux, with STATIC_LLAMA_DIR set to
# the matching release variant (see docs/development.md).

# Tokenization — Oniguruma regex backend (C, built via cc), the same engine as the Python
# `tokenizers` used for the token-id fixture. Not fancy-regex: on a regex pre-tokenizer it
# silently stops splitting once its backtrack limit is hit (~1M-char whitespace runs).
# EmbeddingGemma 2's tokenizer.json has only literal " " patterns, which `tokenizers` compiles
# to escaped regexes that never backtrack; test_token_ids_match_python_tokenizers
# (tests/integration_tests.rs) compares the result with Python's, including a 100k-space run.
# Training-only defaults are disabled.
# HFTokenizer::from_file turns off 0.23's per-thread BPE cache, which leaks on drop; recheck
# that workaround when bumping.
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

# Structured metadata / fixture parsing
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# Error handling
thiserror = "2"

[[example]]
name = "api_usage"
path = "examples/api_usage.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Same as release but keeps debug symbols and frame pointers for perf profiling.
[profile.release-debug]
inherits = "release"
debug = 1
force-frame-pointers = true

[profile.bench]
opt-level = 3
lto = "thin"

[dev-dependencies]
approx = "0.5"
serde = { version = "1", features = ["derive"] }
# Hashes the bundle tokenizer.json against tests/fixtures/token_ids.json.
sha2 = "0.11"
