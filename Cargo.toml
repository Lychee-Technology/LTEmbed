[package]
name = "ltembed"
version = "0.1.0"
edition = "2021"

# Library target: exposes internal modules to integration tests in tests/
[lib]
name = "ltembed"
path = "src/lib.rs"

[dependencies]
# ── Library core ──────────────────────────────────────────────────────────────
# The inference backend is llama.cpp/GGUF, linked from the prebuilt static archives
# published by `Lychee-Technology/static-llama-cpp-rs-builder` (see build.rs). There is no
# crates.io dependency for it: the static libs + bindgen bindings are consumed via raw FFI,
# so this crate builds only on aarch64-linux with STATIC_LLAMA_DIR set (see docs/development.md).

# Tokenization — uses pure-Rust fancy-regex backend by default (no C deps)
tokenizers = "0.22"

# Structured metadata / fixture parsing
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# Error handling
thiserror = "2"

[[example]]
name = "api_usage"
path = "examples/api_usage.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Same as release but keeps debug symbols and frame pointers for perf profiling.
[profile.release-debug]
inherits = "release"
debug = 1
force-frame-pointers = true

[profile.bench]
opt-level = 3
lto = "thin"

[dev-dependencies]
approx = "0.5"
static_assertions = "1"
serde = { version = "1", features = ["derive"] }
